name: Build macOS App

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

env:
  PROJECT_NAME: BrewServicesMenubar
  SCHEME_NAME: BrewServicesMenubar

jobs:
  test:
    name: Test (${{ matrix.runner }}, Xcode ${{ matrix.xcode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-13, xcode: "15.2" }   # min deployment target
          - { runner: macos-14, xcode: "15.4" }
          - { runner: macos-15, xcode: "16.4" }
          - { runner: macos-26, xcode: "26.0" }   # Tahoe — primary crash target
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Build (Debug)
        run: |
          xcodebuild clean build \
            -project ${PROJECT_NAME}.xcodeproj \
            -scheme ${SCHEME_NAME} \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test \
            -project ${PROJECT_NAME}.xcodeproj \
            -scheme ${SCHEME_NAME} \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build (Release) for smoke test
        run: |
          xcodebuild build \
            -project ${PROJECT_NAME}.xcodeproj \
            -scheme ${SCHEME_NAME} \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Smoke launch
        # The crashes we're guarding against all manifest within seconds of
        # launch (popUpMenu on first menu open, NSAlert from background queue,
        # uncatchable NSException from launchPath when brew can't be launched).
        # Launch the built app, give the initial async refresh a chance to run
        # against the runner's real Homebrew install, and confirm the process
        # is still alive.
        run: |
          APP="$PWD/DerivedData/Build/Products/Release/${PROJECT_NAME}.app"
          test -d "$APP" || { echo "App not found at $APP"; ls -R DerivedData/Build/Products; exit 1; }
          open "$APP"
          sleep 3
          if ! pgrep -x "${PROJECT_NAME}" >/dev/null; then
            echo "App died within 3s of launch"
            exit 1
          fi
          sleep 5
          if ! pgrep -x "${PROJECT_NAME}" >/dev/null; then
            echo "App died during initial brew query"
            exit 1
          fi
          pkill -x "${PROJECT_NAME}" || true

  release:
    name: Release build & artifact
    needs: test
    runs-on: macos-15
    env:
      XCODE_VERSION: "16.4"

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${XCODE_VERSION}.app

      - name: Archive
        run: |
          xcodebuild \
            -project ${PROJECT_NAME}.xcodeproj \
            -scheme ${SCHEME_NAME} \
            -configuration Release \
            archive -archivePath $PWD/build/${PROJECT_NAME}.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Export
        run: |
          xcodebuild -exportArchive \
            -archivePath $PWD/build/${PROJECT_NAME}.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $PWD/build

      - name: Get version
        id: get_version
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Zip .app
        run: |
          cd $PWD/build
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            ZIP_NAME="${{ env.PROJECT_NAME }}-${{ steps.get_version.outputs.VERSION }}.zip"
          else
            ZIP_NAME="${{ env.PROJECT_NAME }}.zip"
          fi
          zip -r "$ZIP_NAME" "${{ env.PROJECT_NAME }}.app"
          echo "ZIP_FILE=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}
          path: ${{ github.workspace }}/build/${{ env.ZIP_FILE }}

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/build/${{ env.ZIP_FILE }}
          draft: false
          prerelease: false
